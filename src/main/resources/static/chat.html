<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手</title>
    <!-- Markdown 渲染依赖：marked 解析 + DOMPurify 防 XSS + highlight.js 代码高亮 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <link rel="stylesheet" href="/common.css?v=20261003">
    <link rel="stylesheet" href="/navigation.css?v=20261003">
    <link rel="stylesheet" href="/chat.css?v=20261003">
    <script src="/navigation.js?v=20261003" defer></script>
</head>
<body>
    <div class="app-page app-page--fill">
        <header class="app-nav">
            <div class="app-brand">
                <span class="brand-mark">KE</span>
                <h1>Know Engine</h1>
            </div>
            <nav class="app-nav-links" aria-label="页面导航">
                <a href="/upload.html" class="nav-link">上传文档</a>
                <a href="/document.html" class="nav-link">文档管理</a>
                <a href="/chat.html" class="nav-link is-active">AI 对话</a>
                <a href="/eval-report.html" class="nav-link">RAG 评测</a>
            </nav>
        </header>
        <main class="app-main app-main--flush">
            <div class="chat-layout">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <button class="btn btn-primary new-chat-btn" id="newChatBtn">新对话</button>
                    </div>
                    <div class="conversation-list" id="conversationList">
                        <div class="no-conversations">暂无对话记录</div>
                    </div>
                </div>
                <div class="chat-main">
                    <div class="chat-header" id="chatHeader" style="display: none;">
                        <h3 id="chatTitle">新对话</h3>
                        <span class="conversation-id" id="conversationIdDisplay"></span>
                    </div>

                    <div class="messages-container" id="messagesContainer">
                        <div class="welcome-message" id="welcomeMessage">
                            <h2>欢迎使用 AI 对话助手</h2>
                            <p>输入您的问题，开始与 AI 交流吧！</p>
                        </div>
                    </div>

                    <div class="input-area">
                        <div class="input-wrapper">
                            <textarea id="messageInput" placeholder="输入您的问题..." rows="1"></textarea>
                            <button class="btn btn-primary" id="sendBtn">发送</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/chat.js?v=20261003" defer></script>
</body>
</html>
